# CI deploys with GitHub OIDC, so there is no ServiceAccount or token: the apiserver maps a run
# on sejun-run/ledger-mcp@main to the RoleBinding's user (authentication-config on ampere).
# Applied by hand once; CI only applies deployment.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ledger-deployer
  namespace: ledger
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "create", "update", "patch"]
---
# GitHub Actions OIDC: a run on sejun-run/ledger-mcp@main is mapped to this user by the
# apiserver's authentication-config, so CI holds no stored token.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ledger-deployer-gha
  namespace: ledger
subjects:
  - kind: User
    name: "gha:sejun-run/ledger-mcp"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: ledger-deployer
  apiGroup: rbac.authorization.k8s.io
