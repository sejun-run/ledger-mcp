
server {
    listen 80;
    listen [::]:80;
    server_name ledger.sejun.run;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ledger.sejun.run;

    ssl_certificate /etc/letsencrypt/live/sejun.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sejun.run/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/ledger_access.log main_cf;
    error_log /var/log/nginx/ledger_error.log warn;

    # MCP streamable HTTP: SSE responses, no buffering, long idle
    location / {
        proxy_pass http://<AMPERE_PRIVATE_IP>:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
    }
}
