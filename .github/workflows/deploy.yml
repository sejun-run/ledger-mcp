name: Build and deploy ledger

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy/mcp.json'
      - 'deploy/ledger.sejun.run.conf'
  workflow_dispatch:

concurrency:
  group: ledger-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: registry.sejun.run/ledger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: registry.sejun.run
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_CA: ${{ secrets.KUBE_CA }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
        run: |
          echo "$KUBE_CA" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster k3s --server="$KUBE_SERVER" --certificate-authority=/tmp/ca.crt
          kubectl config set-credentials ledger-deployer --token="$KUBE_TOKEN"
          kubectl config set-context ledger --cluster=k3s --user=ledger-deployer --namespace=ledger
          kubectl config use-context ledger
      - name: Apply (image pinned to this commit)
        run: |
          sed "s|ledger:latest|ledger:${GITHUB_SHA}|" deploy/k8s/deployment.yaml | kubectl apply -f -
          kubectl -n ledger rollout status deployment/ledger --timeout=180s
