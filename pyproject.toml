[project]
name = "ledger-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.3.0",
]

[project.scripts]
ledger-mcp = "ledger_mcp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ledger_mcp"]
